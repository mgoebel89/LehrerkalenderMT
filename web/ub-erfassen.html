<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00639C">
<title>Erfassen · Unterrichtsbesuch</title>
<link rel="icon" href="/static/symbol-192.png" type="image/png" sizes="192x192">
<link rel="stylesheet" href="/static/ub-basis.css">
<link rel="stylesheet" href="/static/ub.css">
<link rel="stylesheet" href="/static/ub-seiten.css">
</head>
<body class="ube-body" data-seite="erfassen" data-skripte="ub-drs.js ub-common.js ub-zeichnen.js ub-eintrag.js ub-erfassen.js">
<div class="ube-app">
  <header class="ube-kopf">
    <div class="ube-kopfzeile">
      <a class="ube-zurueck" data-ub="id" href="/unterrichtsbesuche/{id}" aria-label="Zurück">‹</a>
      <div class="ube-titel"><strong data-ub="name"></strong><small data-ub="unterzeile"></small></div>
      <button type="button" class="ube-menue" id="ubeMenue" aria-label="Menü">⋯</button>
    </div>
    <button type="button" class="ube-phasenknopf" id="ubePhase">
      <span id="ubePhaseName">Phase setzen</span><span aria-hidden="true">▾</span><span class="ube-uhr" id="ubeUhr"></span>
    </button>
  </header>
  <main class="ube-liste" id="ubeListe"><div id="ubeInfo"></div><div id="ubeVerlauf"></div></main>
  <footer class="ube-fuss" id="ubeFuss"></footer>
</div>
<script src="/static/ub-laden.js"></script>
</body>
</html>
